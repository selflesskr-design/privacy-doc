<!doctype html>
<html lang="ko" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Strict Content-Security-Policy — this is the technical backbone of the
      promise that files stay on the device. The only hosts the browser will
      talk to are our own origin and Google Analytics: no CDNs, no external
      fonts, nowhere a file could be sent even if a future change tried. The
      files themselves are never read by the analytics tag, which sees page
      addresses and nothing else. Its config lives in /ga.js on our origin so
      that 'unsafe-inline' is not needed.
        - script-src 'wasm-unsafe-eval': allows WebAssembly (image compression) but not eval().
        - img-src data: blob:: canvas-generated previews and object URLs.
        - worker-src blob:: web workers (pdf.js, image compression) load from blobs.
      If you add a dependency that needs an external host, this CSP will break it
      on purpose — that is the point.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />

    <meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17120F" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Privacy" />
    <meta name="apple-mobile-web-app-title" content="Privacy" />

    <!-- Primary SEO -->
    <!-- Ownership proof for Naver Search Advisor. A tag, not a script: nothing
         is loaded and nothing is sent. Google needs none — selfless.kr is
         verified as a domain property, which covers every subdomain. -->
    <meta name="naver-site-verification" content="64c05ee0d671382dc7976cc1852a6666feb6dedd" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N4R2D8DVN4"></script>
    <script src="/ga.js"></script>
    <title>Privacy — PDF·사진 개인정보 가리기</title>
    <meta
      name="description"
      content="PDF와 사진 속 개인정보를 가리고, 사진 정보를 지우고, PDF를 합치거나 용량을 줄입니다. 파일은 내 브라우저에서 직접 처리됩니다. 무료이고 가입이 필요 없습니다."
    />
    <meta
      name="keywords"
      content="개인정보 가리기, 주민등록번호 가리기, PDF 개인정보, PDF 편집, PDF 합치기, PDF 용량 줄이기, 사진 위치정보 삭제, EXIF 삭제, 무료 PDF 도구, 브라우저 PDF"
    />
    <meta name="author" content="selflesskr" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://privacy.selfless.kr/" />

    <!-- Open Graph (Facebook, LinkedIn, KakaoTalk, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Privacy" />
    <meta property="og:title" content="Privacy — PDF·사진 개인정보 가리기" />
    <meta
      property="og:description"
      content="PDF와 사진 속 개인정보를 가립니다. 파일은 내 브라우저에서 직접 처리되고 밖으로 나가지 않습니다. 무료이고 가입이 필요 없습니다."
    />
    <meta property="og:url" content="https://privacy.selfless.kr/" />
    <meta property="og:image" content="https://privacy.selfless.kr/og.png?v=20260802" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privacy — PDF·사진 개인정보 가리기" />
    <meta
      name="twitter:description"
      content="PDF와 사진 속 개인정보를 가립니다. 파일은 내 브라우저에서 직접 처리되고 밖으로 나가지 않습니다."
    />
    <meta name="twitter:image" content="https://privacy.selfless.kr/og.png?v=20260802" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
