<!doctype html>
<html lang="ko" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Strict Content-Security-Policy — this is the technical backbone of Privacy's
      "provably local" guarantee. connect-src 'self' means the app is forbidden
      from making any outbound network request (fetch/XHR/WebSocket) to any host
      other than its own origin. No CDNs, no analytics, no external fonts.
        - script-src 'wasm-unsafe-eval': allows WebAssembly (image compression) but not eval().
        - img-src data: blob:: canvas-generated previews and object URLs.
        - worker-src blob:: web workers (pdf.js, image compression) load from blobs.
      If you add a dependency that needs an external host, this CSP will break it
      on purpose — that is the point.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />

    <meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17120F" media="(prefers-color-scheme: dark)" />

    <!-- Primary SEO -->
    <title>Privacy — PDF·사진 개인정보 가리기</title>
    <meta
      name="description"
      content="PDF와 사진 속 개인정보를 가리고, 사진 정보를 지우고, PDF를 합치거나 용량을 줄입니다. 파일은 내 브라우저에서 직접 처리됩니다. 무료이고 가입이 필요 없습니다."
    />
    <meta
      name="keywords"
      content="개인정보 가리기, 주민등록번호 가리기, PDF 개인정보, PDF 편집, PDF 합치기, PDF 용량 줄이기, 사진 위치정보 삭제, EXIF 삭제, 무료 PDF 도구, 브라우저 PDF"
    />
    <meta name="author" content="selflesskr" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://privacy.selfless.kr/" />

    <!-- Open Graph (Facebook, LinkedIn, KakaoTalk, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Privacy" />
    <meta property="og:title" content="Privacy — PDF·사진 개인정보 가리기" />
    <meta
      property="og:description"
      content="PDF와 사진 속 개인정보를 가립니다. 파일은 내 브라우저에서 직접 처리되고 밖으로 나가지 않습니다. 무료이고 가입이 필요 없습니다."
    />
    <meta property="og:url" content="https://privacy.selfless.kr/" />
    <meta property="og:image" content="https://privacy.selfless.kr/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privacy — PDF·사진 개인정보 가리기" />
    <meta
      name="twitter:description"
      content="PDF와 사진 속 개인정보를 가립니다. 파일은 내 브라우저에서 직접 처리되고 밖으로 나가지 않습니다."
    />
    <meta name="twitter:image" content="https://privacy.selfless.kr/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
